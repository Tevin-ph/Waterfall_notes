<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waterfall Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f5f2; --card:#ffffff; --ink:#111114; --dim:#8a8780; --line:#e7e3dd; --peach:#ffdcc2; --peach2:#ffc9a3; --rec:#e5484d; --right:#7cc4ff; --left:#ffa970; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.3 Outfit, "Avenir Next", "Segoe UI", system-ui, sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }
  button, select, label.nav { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer; transition:background .15s, border-color .15s, color .15s; }
  button:hover, select:hover, label.nav:hover { border-color:var(--ink); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  input[type=file] { display:none; }
  select { appearance:none; padding-right:14px; }

  /* top bar */
  #top { display:flex; align-items:stretch; background:var(--card); border-bottom:1px solid var(--line); min-height:56px; }
  .brand { display:flex; align-items:center; gap:10px; padding:0 18px; border-right:1px solid var(--line); font-weight:600; line-height:1.05; letter-spacing:-.01em; }
  .brand svg { width:28px; height:22px; }
  .navs { display:flex; align-items:center; gap:8px; padding:0 14px; flex-wrap:wrap; }
  .navs .status { color:var(--dim); font-size:12px; max-width:22ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #title { margin-left:auto; align-self:center; color:var(--dim); max-width:26ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 14px; }
  .recGrp { display:flex; align-items:center; gap:8px; padding:0 14px; background:var(--peach); }
  .recGrp select { background:rgba(255,255,255,.6); border-color:transparent; }
  .recGrp #rec { background:var(--ink); color:#fff; border-color:var(--ink); }
  .recGrp #rec.rec { background:var(--rec); border-color:var(--rec); }

  /* layers */
  #layers { display:flex; flex-wrap:wrap; gap:6px; padding:8px 18px 0; }
  #layers[hidden] { display:none; }
  .chip { display:flex; align-items:center; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px 4px 3px 12px; }
  .chip .dot { width:10px; height:10px; border-radius:50%; }
  .chip.muted { opacity:.5; }
  .chip button { padding:2px 10px; font-size:12px; }

  /* stage */
  #stage { flex:1; position:relative; min-height:0; margin:12px 18px; border-radius:20px; overflow:hidden; background:#101015; box-shadow:0 1px 0 rgba(0,0,0,.04), 0 12px 30px -18px rgba(0,0,0,.45); }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hint { position:absolute; left:0; right:0; top:40%; text-align:center; color:#9a97a0; pointer-events:none; font-size:16px; }
  #stage.drag { outline:2px dashed var(--peach2); outline-offset:-10px; }

  /* dock */
  #dock { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:10px 18px 14px; }
  #dock #play { background:var(--ink); color:#fff; border-color:var(--ink); padding:9px 20px; font-weight:500; }
  #dock #restart { width:38px; height:38px; padding:0; }
  #time { color:var(--dim); font-variant-numeric:tabular-nums; min-width:92px; }
  #seek { flex:1 1 220px; min-width:160px; accent-color:var(--ink); }
  .opts { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .opts .sep { width:1px; height:20px; background:var(--line); margin:0 4px; }
  @media (max-width:700px) { #title, .brand span { display:none; } #stage { margin:8px 10px; border-radius:14px; } #dock { padding:8px 10px 12px; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <svg viewBox="0 0 28 22" aria-hidden="true"><rect x="0" y="3" width="7" height="19" rx="3" fill="#111114"/><rect x="10.5" y="0" width="7" height="22" rx="3" fill="#111114"/><rect x="21" y="3" width="7" height="19" rx="3" fill="#111114"/></svg>
      <span>waterfall<br>notes</span>
    </div>
    <div class="navs">
      <label class="nav">New song<input id="file" type="file" accept=".mid,.midi,audio/midi"></label>
      <label class="nav" title="Photo or PDF of sheet music, or a MusicXML file">Scan sheet<input id="scanFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.xml,.musicxml,image/*"></label>
      <label class="nav" title="An audio or video file of someone playing; it is turned into falling notes on this computer">Audio / video<input id="audioFile" type="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.mp4,.mov,.webm,.ogg,.flac"></label>
      <button id="demo">Demo</button>
      <button id="midiBtn">Connect keyboard</button>
      <button id="saveMidi" title="Download everything as a .mid file">Save MIDI</button>
      <span id="midiStatus" class="status"></span>
    </div>
    <div id="title"></div>
    <div class="recGrp">
      <select id="recHand" title="Which hand this take is">
        <option value="auto">Auto split (C4)</option><option value="0">Right hand</option><option value="1">Left hand</option>
      </select>
      <button id="rec" title="Record a new layer while the song plays">&#9679; Record</button>
    </div>
  </header>
  <div id="layers" hidden></div>
  <main id="stage"><canvas id="cv"></canvas><div id="hint">Drop a .mid file here, or press Demo</div></main>
  <footer id="dock">
    <button id="play" title="Space">&#9654; Play</button>
    <button id="restart" title="Home">&#8634;</button>
    <div id="time">0:00 / 0:00</div>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
    <div class="opts">
      <select id="speed" title="Speed">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="0.75">0.75x</option>
        <option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>
      </select>
      <select id="look" title="Look"><option value="flat">Flat</option><option value="spectrum">Spectrum</option></select>
      <select id="hands" title="Guide hands"><option value="both">Both hands</option><option value="right">Right hand</option><option value="left">Left hand</option></select>
      <span class="sep"></span>
      <button id="metro">Metronome</button>
      <button id="countin">Count-in</button>
      <button id="letters" class="on" title="Show note names on the bars">Letters</button>
      <span class="sep"></span>
      <button id="loopA">A</button><button id="loopB">B</button><button id="loopOn">Loop</button>
    </div>
  </footer>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
// ---------- Song model ----------
// song = { notes:[{m,t,d,v,h}], dur, bpm, name }  (h: 0 right, 1 left; t,d in seconds)
// base = notes from the loaded file; layers = recorded takes; notes = merged, audible set (rebuilt by rebuild()).
let song = { notes: [], base: [], layers: [], dur: 0, bpm: 100, name: "", minDur: 0 };
const NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const handOfAuto = m => (m < 60 ? 1 : 0);
function rebuild() {
  const all = song.base.slice();
  for (const L of song.layers) if (!L.muted)
    for (const n of L.notes) all.push({ m: n.m, t: n.t, d: n.d, v: n.v, h: L.hand === "auto" ? handOfAuto(n.m) : +L.hand, layer: L.id });
  all.sort((a, b) => a.t - b.t);
  let end = 0; for (const n of all) if (n.t + n.d > end) end = n.t + n.d;
  song.notes = all;
  song.dur = Math.max(song.minDur, all.length ? end + 1 : 0);
}

function buildDemo() {
  const bpm = 100, beat = 60 / bpm, notes = [];
  const mel = [
    [64,0,1],[64,1,1],[65,2,1],[67,3,1],  [67,4,1],[65,5,1],[64,6,1],[62,7,1],
    [60,8,1],[60,9,1],[62,10,1],[64,11,1], [64,12,1.5],[62,13.5,.5],[62,14,2],
    [64,16,1],[64,17,1],[65,18,1],[67,19,1],  [67,20,1],[65,21,1],[64,22,1],[62,23,1],
    [60,24,1],[60,25,1],[62,26,1],[64,27,1], [62,28,1.5],[60,29.5,.5],[60,30,2],
  ];
  const bass = [];
  for (let bar = 0; bar < 8; bar++) {
    const a = bar % 2 === 0 ? [48, 55] : [43, 48];
    bass.push([a[0], bar * 4, 2], [a[1], bar * 4 + 2, 2]);
  }
  for (const [m, b, d] of mel) notes.push({ m, t: b * beat, d: d * beat * 0.95, v: 0.8, h: 0 });
  for (const [m, b, d] of bass) notes.push({ m, t: b * beat, d: d * beat * 0.95, v: 0.6, h: 1 });
  notes.sort((x, y) => x.t - y.t);
  return { notes, dur: 32 * beat + 1, bpm, name: "Ode to Joy (demo)" };
}

// ---------- Minimal MIDI parser ----------
function parseMidi(buf) {
  const dv = new DataView(buf); let p = 0;
  const str = n => { let s = ""; for (let i = 0; i < n; i++) s += String.fromCharCode(dv.getUint8(p++)); return s; };
  if (str(4) !== "MThd") throw new Error("Not a MIDI file");
  p += 4;
  const format = dv.getUint16(p); p += 2;
  const ntrk = dv.getUint16(p); p += 2;
  const div = dv.getUint16(p); p += 2;
  if (div & 0x8000) throw new Error("SMPTE timing is not supported");
  const tempos = [{ tick: 0, uspq: 500000 }];
  const raw = []; // {m,on,tick,vel,trk}
  const names = [];
  for (let tr = 0; tr < ntrk; tr++) {
    if (p + 8 > dv.byteLength) break;
    const id = str(4), len = dv.getUint32(p); p += 4;
    const end = p + len;
    if (id !== "MTrk") { p = end; continue; }
    let tick = 0, status = 0;
    const vlq = () => { let v = 0, b; do { b = dv.getUint8(p++); v = (v << 7) | (b & 0x7f); } while (b & 0x80); return v; };
    while (p < end) {
      tick += vlq();
      let b = dv.getUint8(p);
      if (b & 0x80) { status = b; p++; }
      if (status === 0xff) {
        const type = dv.getUint8(p++), l = vlq();
        if (type === 0x51 && l === 3) tempos.push({ tick, uspq: (dv.getUint8(p) << 16) | (dv.getUint8(p + 1) << 8) | dv.getUint8(p + 2) });
        if (type === 0x03 && !names.length) { let s = ""; for (let i = 0; i < l; i++) s += String.fromCharCode(dv.getUint8(p + i)); names.push(s); }
        p += l;
      } else if (status === 0xf0 || status === 0xf7) { p += vlq(); }
      else {
        const hi = status & 0xf0;
        const a = dv.getUint8(p++);
        const c = (hi === 0xc0 || hi === 0xd0) ? 0 : dv.getUint8(p++);
        const ch = status & 0x0f;
        if (hi === 0x90 && c > 0) raw.push({ m: a, on: true, tick, vel: c, trk: tr, ch });
        else if (hi === 0x80 || (hi === 0x90 && c === 0)) raw.push({ m: a, on: false, tick, trk: tr, ch });
      }
    }
    p = end;
  }
  tempos.sort((a, b) => a.tick - b.tick);
  // tick -> seconds via tempo map
  const segs = []; let acc = 0, lastTick = 0, cur = tempos[0].uspq;
  segs.push({ tick: 0, sec: 0, uspq: cur });
  for (const t of tempos.slice(1)) {
    acc += (t.tick - lastTick) * cur / div / 1e6; lastTick = t.tick; cur = t.uspq;
    segs.push({ tick: t.tick, sec: acc, uspq: cur });
  }
  const toSec = tick => { let s = segs[0]; for (const g of segs) { if (g.tick <= tick) s = g; else break; } return s.sec + (tick - s.tick) * s.uspq / div / 1e6; };
  raw.sort((a, b) => a.tick - b.tick || (a.on ? 1 : 0) - (b.on ? 1 : 0)); // offs before ons at same tick
  const open = new Map(), notes = [];
  for (const e of raw) {
    const k = e.trk * 256 + e.ch * 128 + e.m;
    if (e.on) { if (!open.has(k)) open.set(k, []); open.get(k).push(e); }
    else { const q = open.get(k); if (q && q.length) { const s = q.shift(); notes.push({ m: s.m, t: toSec(s.tick), d: Math.max(0.05, toSec(e.tick) - toSec(s.tick)), v: s.vel / 127, h: 0, trk: s.trk }); } }
  }
  if (!notes.length) throw new Error("No notes found in this file");
  // hand split: by track when 2+ tracks have notes, else by middle C
  const trks = [...new Set(notes.map(n => n.trk))].sort((a, b) => a - b);
  if (trks.length >= 2) {
    const avg = trks.map(t => { const ns = notes.filter(n => n.trk === t); return ns.reduce((s, n) => s + n.m, 0) / ns.length; });
    const lowTrk = trks[avg.indexOf(Math.min(...avg))];
    for (const n of notes) n.h = n.trk === lowTrk ? 1 : 0;
  } else for (const n of notes) n.h = n.m < 60 ? 1 : 0;
  notes.sort((a, b) => a.t - b.t);
  const dur = Math.max(...notes.map(n => n.t + n.d)) + 1;
  return { notes, dur, bpm: Math.round(60e6 / tempos[0].uspq), name: names[0] || "MIDI file" };
}

// ---------- MusicXML -> notes (what sheet-music scanning produces) ----------
function parseMusicXml(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("That is not valid MusicXML");
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const parts = [...doc.querySelectorAll("score-partwise > part")];
  if (!parts.length) throw new Error("No parts found (only score-partwise MusicXML is supported)");
  const txt = (el, sel) => { const x = el.querySelector(sel); return x ? x.textContent.trim() : null; };
  let bpm = 0; const q = doc.querySelector("sound[tempo]"); if (q) bpm = parseFloat(q.getAttribute("tempo")) || 0;
  if (!bpm) bpm = 100;
  const secPerQ = 60 / bpm, notes = [];
  parts.forEach((part, pi) => {
    let div = 1, cursor = 0, staves = 1;
    const tied = new Map();
    for (const measure of part.querySelectorAll(":scope > measure")) {
      const mStart = cursor; let mEnd = cursor, last = cursor;
      for (const el of measure.children) {
        if (el.tagName === "attributes") {
          const d = txt(el, "divisions"); if (d) div = parseFloat(d) || div;
          const s = txt(el, "staves"); if (s) staves = parseInt(s) || 1;
        } else if (el.tagName === "backup") { cursor -= parseFloat(txt(el, "duration")) || 0; }
        else if (el.tagName === "forward") { cursor += parseFloat(txt(el, "duration")) || 0; mEnd = Math.max(mEnd, cursor); }
        else if (el.tagName === "note") {
          const dur = parseFloat(txt(el, "duration")) || 0, chord = !!el.querySelector(":scope > chord");
          const start = chord ? last : cursor;
          if (!el.querySelector(":scope > rest") && !el.querySelector(":scope > grace")) {
            const step = txt(el, "pitch > step"), oct = parseInt(txt(el, "pitch > octave"));
            if (step in STEP && !isNaN(oct)) {
              const m = 12 * (oct + 1) + STEP[step] + (parseFloat(txt(el, "pitch > alter")) || 0);
              const staff = parseInt(txt(el, "staff") || "1"), voice = txt(el, "voice") || "1";
              const key = pi + ":" + staff + ":" + voice + ":" + m;
              const tStop = el.querySelector(':scope > tie[type="stop"]'), tStart = el.querySelector(':scope > tie[type="start"]');
              if (tStop && tied.has(key)) { const n = tied.get(key); n.d = (start + dur) / div * secPerQ - n.t; if (!tStart) tied.delete(key); }
              else {
                const n = { m, t: start / div * secPerQ, d: Math.max(0.05, dur / div * secPerQ * 0.97), v: 0.75, h: 0, staff, part: pi };
                notes.push(n); if (tStart) tied.set(key, n);
              }
            }
          }
          if (!chord) { last = cursor; cursor += dur; } else last = start;
          mEnd = Math.max(mEnd, cursor);
        }
      }
      cursor = Math.max(cursor, mEnd);
      if (cursor < mStart) cursor = mStart;
    }
    notes.filter(n => n.part === pi).forEach(n => { n._staves = staves; });
  });
  if (!notes.length) throw new Error("No notes found in that score");
  const multiPart = parts.length > 1;
  for (const n of notes) {
    if (n._staves > 1) n.h = n.staff >= 2 ? 1 : 0;           // piano grand staff: staff 2 = left hand
    else if (multiPart) n.h = n.part === 0 ? 0 : 1;           // separate parts: first = right hand
    else n.h = n.m < 60 ? 1 : 0;
    delete n.staff; delete n.part; delete n._staves;
  }
  notes.sort((a, b) => a.t - b.t);
  const title = txt(doc, "work-title") || txt(doc, "movement-title");
  return { notes, dur: 0, bpm, name: title || "Scanned score" };
}

// ---------- Audio ----------
let ac = null;
function ensureAudio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === "suspended") ac.resume(); return ac; }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function playNote(m, vel, when, len) {
  const f = mtof(m), g = ac.createGain(), out = ac.destination;
  const peak = 0.05 + 0.22 * vel * (m < 60 ? 1 : 0.8);
  const rel = Math.max(len, 0.12);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(peak, when + 0.006);
  g.gain.exponentialRampToValueAtTime(peak * 0.35, when + Math.min(0.5, rel * 0.6));
  g.gain.exponentialRampToValueAtTime(0.0001, when + rel + 0.35);
  g.connect(out);
  [[1, "triangle", 1], [2, "sine", 0.4], [3, "sine", 0.15]].forEach(([mul, type, amp]) => {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = type; o.frequency.value = f * mul; og.gain.value = amp;
    o.connect(og); og.connect(g);
    o.start(when); o.stop(when + rel + 0.4);
  });
}
function click(when, accent) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = accent ? 1500 : 1000; o.type = "square";
  g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(0.12, when + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.05);
  o.connect(g); g.connect(ac.destination); o.start(when); o.stop(when + 0.06);
}

// ---------- Transport ----------
const S = { playing: false, speed: 1, anchorCtx: 0, anchorPos: 0, nextIdx: 0, nextBeat: 0, metro: false, countin: false,
            loopA: null, loopB: null, loopOn: false, look: "flat", hands: "both" };
const LOOKAHEAD = 0.25; // seconds of audio scheduled ahead
const rec = { on: false, notes: [], open: new Map(), count: 0 };
S.letters = true;

function pos() {
  if (!S.playing) return S.anchorPos;
  return S.anchorPos + Math.max(0, ac.currentTime - S.anchorCtx) * S.speed;
}
const beatLen = () => 60 / song.bpm;
function firstIdx(t) { let lo = 0, hi = song.notes.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (song.notes[mid].t < t - 1e-6) lo = mid + 1; else hi = mid; } return lo; }
function resetSched(p) { S.nextIdx = firstIdx(p); S.nextBeat = Math.ceil(p / beatLen() - 1e-6); }

function play() {
  if (!song.notes.length && !rec.on) return;
  ensureAudio();
  let p = S.anchorPos;
  if (p >= song.dur - 0.05) p = S.loopOn && S.loopA != null ? S.loopA : 0;
  S.anchorPos = p; resetSched(p);
  let start = ac.currentTime + 0.05;
  if (S.countin) {
    const step = beatLen() / S.speed;
    for (let i = 0; i < 4; i++) click(start + i * step, i === 0);
    start += 4 * step;
  }
  S.anchorCtx = start; S.playing = true; syncUI();
}
function pause() { if (!S.playing) return; S.anchorPos = pos(); S.playing = false; syncUI(); }
function seek(t) {
  t = Math.max(0, Math.min(song.dur, t));
  if (S.playing) { S.anchorPos = t; S.anchorCtx = ac.currentTime + 0.03; } else S.anchorPos = t;
  resetSched(t);
}
function setSpeed(v) { const p = pos(); S.speed = v; if (S.playing) { S.anchorPos = p; S.anchorCtx = ac.currentTime; } }

const allowed = n => S.hands === "both" || (S.hands === "right" ? n.h === 0 : n.h === 1);

function scheduler() {
  if (!S.playing) return;
  const p = pos();
  if (S.loopOn && S.loopA != null && S.loopB != null && S.loopB > S.loopA && p >= S.loopB) { seek(S.loopA); return; }
  if (p >= song.dur) { if (rec.on) { stopRec(); return; } S.anchorPos = song.dur; S.playing = false; syncUI(); return; }
  const horizon = p + LOOKAHEAD * S.speed;
  while (S.nextIdx < song.notes.length && song.notes[S.nextIdx].t < horizon) {
    const n = song.notes[S.nextIdx++];
    const when = S.anchorCtx + (n.t - S.anchorPos) / S.speed;
    if (allowed(n) && when >= ac.currentTime - 0.01) playNote(n.m, n.v, Math.max(when, ac.currentTime), n.d / S.speed);
  }
  while (S.nextBeat * beatLen() < horizon) {
    const t = S.nextBeat * beatLen(), when = S.anchorCtx + (t - S.anchorPos) / S.speed;
    if (S.metro && when >= ac.currentTime - 0.01) click(Math.max(when, ac.currentTime), S.nextBeat % 4 === 0);
    S.nextBeat++;
  }
}
setInterval(scheduler, 25);

// ---------- Rendering ----------
const cv = document.getElementById("cv"), cx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() { const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; cx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize);

const FIRST = 21, LAST = 108;
const isBlack = m => [1, 3, 6, 8, 10].includes(m % 12);
// key geometry in "white key units": returns {x, w} where x is left edge, 52 white keys total
const keyGeo = (() => {
  const g = {}; let w = 0;
  for (let m = FIRST; m <= LAST; m++) {
    if (!isBlack(m)) { g[m] = { x: w, w: 1, b: false }; w++; }
  }
  for (let m = FIRST; m <= LAST; m++) if (isBlack(m)) { const l = g[m - 1]; g[m] = { x: l ? l.x + 1 - 0.3 : 0, w: 0.6, b: true }; }
  return g;
})();
const WHITE_COUNT = 52;

const handColor = h => (h === 0 ? "hsl(205,100%,72%)" : "hsl(24,100%,70%)");
function color(n, alpha = 1) {
  if (S.look === "spectrum") return `hsla(${(n.m % 12) * 30},90%,72%,${alpha})`;
  return n.h === 0 ? `hsla(205,100%,72%,${alpha})` : `hsla(24,100%,70%,${alpha})`;
}

const LOOK_AHEAD_SEC = 4, PERSP = 2.2;
const SFAR = 1 / (1 + PERSP);

function draw() {
  requestAnimationFrame(draw);
  if (!W) return;
  const p = pos();
  cx.clearRect(0, 0, W, H);
  const kbH = Math.max(70, Math.min(150, H * 0.2)), kbTop = H - kbH, horizon = 8;
  const unit = W / WHITE_COUNT;
  // map: time-distance dt (sec) -> {y, scale}
  const proj = dt => { const z = Math.max(0, dt) / LOOK_AHEAD_SEC; const s = 1 / (1 + PERSP * z); const sn = (s - SFAR) / (1 - SFAR); return { y: horizon + (kbTop - horizon) * Math.max(0, sn), k: 0.35 + 0.65 * Math.max(0, sn) }; };
  const xAt = (kx, k) => W / 2 + (kx * unit - W / 2) * k;

  // background gradient + beat lines
  cx.fillStyle = "#101015"; cx.fillRect(0, 0, W, H);
  const bg = cx.createLinearGradient(0, 0, 0, kbTop); bg.addColorStop(0, "#0d0d12"); bg.addColorStop(1, "#1a1a22");
  cx.fillStyle = bg; cx.fillRect(0, 0, W, kbTop);
  cx.lineWidth = 1;
  const bl = beatLen();
  for (let b = Math.floor(p / bl); b * bl < p + LOOK_AHEAD_SEC; b++) {
    const dt = b * bl - p; if (dt < 0) continue;
    const { y, k } = proj(dt);
    cx.strokeStyle = b % 4 === 0 ? "rgba(255,255,255,.14)" : "rgba(255,255,255,.05)";
    cx.beginPath(); cx.moveTo(xAt(0, k), y); cx.lineTo(xAt(WHITE_COUNT, k), y); cx.stroke();
  }
  // octave guide lines (at every C)
  cx.strokeStyle = "rgba(255,255,255,.05)";
  for (let m = FIRST; m <= LAST; m++) if (m % 12 === 0) { const g = keyGeo[m]; cx.beginPath(); cx.moveTo(xAt(g.x, 0.35), horizon); cx.lineTo(xAt(g.x, 1), kbTop); cx.stroke(); }
  // loop region marks
  if (S.loopA != null) markLine(S.loopA, "A");
  if (S.loopB != null) markLine(S.loopB, "B");
  function markLine(t, label) { const dt = t - p; if (dt < 0 || dt > LOOK_AHEAD_SEC) return; const { y, k } = proj(dt); cx.strokeStyle = "#6ea8ff"; cx.beginPath(); cx.moveTo(xAt(0, k), y); cx.lineTo(xAt(WHITE_COUNT, k), y); cx.stroke(); cx.fillStyle = "#6ea8ff"; cx.font = "11px system-ui"; cx.fillText(label, 6, y - 3); }

  // notes
  const active = new Map();
  const i0 = Math.max(0, firstIdx(p - 12));
  for (let i = i0; i < song.notes.length; i++) {
    const n = song.notes[i];
    if (n.t - p > LOOK_AHEAD_SEC) break;
    const end = n.t + n.d;
    if (end < p) continue;
    const g = keyGeo[n.m]; if (!g) continue;
    const dim = !allowed(n);
    const a = proj(n.t - p), b = proj(Math.min(end - p, LOOK_AHEAD_SEC));
    const kw = g.w * 0.92, kx = g.x + (g.w - kw) / 2;
    const x1 = xAt(kx, a.k), x2 = xAt(kx + kw, a.k), x3 = xAt(kx + kw, b.k), x4 = xAt(kx, b.k);
    cx.beginPath(); cx.moveTo(x1, a.y); cx.lineTo(x2, a.y); cx.lineTo(x3, b.y); cx.lineTo(x4, b.y); cx.closePath();
    const fade = 1 - Math.min(1, Math.max(0, (n.t - p) / LOOK_AHEAD_SEC)) * 0.55;
    cx.fillStyle = color(n, (dim ? 0.18 : 0.95) * fade);
    if (!dim) { cx.shadowColor = color(n, 0.75 * fade); cx.shadowBlur = 16; }
    cx.fill(); cx.shadowBlur = 0;
    if (!dim) {
      // Round the corners with a same-colour stroke. Spectrum colours by pitch, so keep the hand visible as a border.
      cx.lineJoin = "round";
      cx.strokeStyle = S.look === "spectrum" ? handColor(n.h) : color(n, 0.95 * fade);
      cx.lineWidth = S.look === "spectrum" ? 3 : 5; cx.stroke(); cx.lineWidth = 1;
      const wb = x2 - x1;
      if (S.letters && wb >= 8) {
        const fs = Math.min(18, wb * 0.8), ty = a.y - Math.min(fs * 0.8, (a.y - b.y) / 2);
        cx.font = `700 ${fs}px system-ui`; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.lineJoin = "round";
        cx.lineWidth = 3; cx.strokeStyle = "rgba(255,255,255,.55)"; cx.strokeText(NAMES[n.m % 12], (x1 + x2) / 2, ty);
        cx.fillStyle = "#14141a"; cx.fillText(NAMES[n.m % 12], (x1 + x2) / 2, ty);
        cx.textAlign = "left"; cx.textBaseline = "alphabetic"; cx.lineWidth = 1;
      }
    }
    if (n.t <= p && end >= p && !dim) active.set(n.m, n);
  }

  // keys held on the connected keyboard (shown in their hand colour)
  for (const [m, k] of liveKeys) active.set(m, { m, h: k.h });
  // keyboard
  const drawKey = (m, black) => {
    const g = keyGeo[m]; const x = g.x * unit, w = g.w * unit, h = black ? kbH * 0.62 : kbH;
    const n = active.get(m);
    let fill;
    if (n) fill = color(n, 1);
    else { fill = cx.createLinearGradient(0, kbTop, 0, kbTop + h); if (black) { fill.addColorStop(0, "#2b2b33"); fill.addColorStop(1, "#0b0b0f"); } else { fill.addColorStop(0, "#ffffff"); fill.addColorStop(1, "#e4e0da"); } }
    cx.fillStyle = fill;
    cx.beginPath(); cx.roundRect(x + 0.5, kbTop - (black ? 0 : 0), w - 1, h, [0, 0, black ? 3 : 4, black ? 3 : 4]); cx.fill();
    if (!black && !n) { cx.strokeStyle = "rgba(0,0,0,.18)"; cx.stroke(); }
  };
  for (let m = FIRST; m <= LAST; m++) if (!isBlack(m)) drawKey(m, false);
  for (let m = FIRST; m <= LAST; m++) if (isBlack(m)) drawKey(m, true);
  cx.fillStyle = "rgba(255,255,255,.5)"; cx.font = "10px system-ui";
  for (let m = FIRST; m <= LAST; m++) if (m % 12 === 0) cx.fillText("C" + (m / 12 - 1), keyGeo[m].x * unit + 3, H - 4);
  // light bloom from every sounding key + a soft hit line
  for (const [m, n] of active) {
    const g = keyGeo[m]; if (!g) continue;
    const bx = (g.x + g.w / 2) * unit, r = unit * 4.5;
    const rg = cx.createRadialGradient(bx, kbTop, 0, bx, kbTop, r);
    rg.addColorStop(0, color(n, 0.55)); rg.addColorStop(1, color(n, 0));
    cx.fillStyle = rg; cx.fillRect(bx - r, kbTop - r, r * 2, r * 1.4);
  }
  const hl = cx.createLinearGradient(0, 0, W, 0); hl.addColorStop(0, "rgba(255,255,255,0)"); hl.addColorStop(0.5, "rgba(255,255,255,.9)"); hl.addColorStop(1, "rgba(255,255,255,0)");
  cx.fillStyle = hl; cx.fillRect(0, kbTop - 1.5, W, 1.5);

  // count-in overlay
  if (S.playing && ac.currentTime < S.anchorCtx) {
    const left = Math.ceil((S.anchorCtx - ac.currentTime) / (beatLen() / S.speed));
    cx.fillStyle = "rgba(255,255,255,.85)"; cx.font = "bold 72px system-ui"; cx.textAlign = "center"; cx.fillText(String(Math.min(4, left)), W / 2, kbTop / 2); cx.textAlign = "left";
  }
  updateTime(p);
}

// ---------- Keyboard input (Web MIDI), live monitor, recording ----------
const liveKeys = new Map();   // midi note -> { h }
const voices = new Map();     // midi note -> { g, oscs } (sustained while key is held)
const midiIns = new Map();    // id -> MIDIInput

function voiceOn(m, vel) {
  ensureAudio(); voiceOff(m, true);
  const now = ac.currentTime, peak = 0.05 + 0.22 * vel * (m < 60 ? 1 : 0.8), g = ac.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(peak, now + 0.006);
  g.gain.exponentialRampToValueAtTime(peak * 0.4, now + 0.8);
  g.connect(ac.destination);
  const oscs = [[1, "triangle", 1], [2, "sine", 0.4], [3, "sine", 0.15]].map(([mul, type, amp]) => {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = type; o.frequency.value = mtof(m) * mul; og.gain.value = amp; o.connect(og); og.connect(g); o.start(now); return o;
  });
  voices.set(m, { g, oscs });
}
function voiceOff(m, quick) {
  const v = voices.get(m); if (!v) return; voices.delete(m);
  const now = ac.currentTime, tail = quick ? 0.03 : 0.3;
  v.g.gain.cancelScheduledValues(now);
  v.g.gain.setValueAtTime(Math.max(v.g.gain.value, 0.0001), now);
  v.g.gain.exponentialRampToValueAtTime(0.0001, now + tail);
  v.oscs.forEach(o => o.stop(now + tail + 0.05));
}
const liveHand = m => { const v = $("recHand").value; return v === "auto" ? handOfAuto(m) : +v; };

// Map a MIDI event timestamp (performance.now domain) to song seconds.
function songPosAt(ts) {
  if (!S.playing) return S.anchorPos;
  const o = ac.getOutputTimestamp ? ac.getOutputTimestamp() : null;
  const ctxT = o && o.performanceTime ? o.contextTime + (ts - o.performanceTime) / 1000 : ac.currentTime;
  return Math.max(0, S.anchorPos + (ctxT - S.anchorCtx) * S.speed);
}
function noteIn(m, vel, ts) {
  voiceOn(m, vel); liveKeys.set(m, { h: liveHand(m) });
  if (rec.on) rec.open.set(m, { t: songPosAt(ts), v: vel });
}
function noteOut(m, ts) {
  voiceOff(m); liveKeys.delete(m);
  const o = rec.open.get(m);
  if (rec.on && o) { rec.open.delete(m); rec.notes.push({ m, t: o.t, d: Math.max(0.05, songPosAt(ts) - o.t), v: o.v }); }
}
function onMidiMsg(e) {
  const [st, a, b] = e.data, cmd = st & 0xf0;
  if (cmd === 0x90 && b > 0) noteIn(a, b / 127, e.timeStamp);
  else if (cmd === 0x80 || (cmd === 0x90 && b === 0)) noteOut(a, e.timeStamp);
}
function refreshInputs(access) {
  for (const inp of access.inputs.values()) { if (!midiIns.has(inp.id) && inp.state === "connected") { inp.onmidimessage = onMidiMsg; midiIns.set(inp.id, inp); } }
  for (const [id, inp] of midiIns) if (inp.state !== "connected") midiIns.delete(id);
  const names = [...midiIns.values()].map(i => i.name);
  $("midiStatus").textContent = names.length ? names.join(", ") : "No keyboard found";
  $("midiBtn").classList.toggle("on", names.length > 0);
}
async function connectKeyboard() {
  if (!navigator.requestMIDIAccess) { $("midiStatus").textContent = "Use Chrome or Edge for MIDI"; return; }
  try {
    const access = await navigator.requestMIDIAccess();
    ensureAudio(); refreshInputs(access); access.onstatechange = () => refreshInputs(access);
  } catch (e) { $("midiStatus").textContent = "MIDI blocked: allow it in the address bar"; }
}

function startRec() {
  if (!midiIns.size) { $("midiStatus").textContent = "Connect a keyboard first"; return; }
  if (!song.notes.length) { song.minDur = 600; rebuild(); }   // blank take: 10 min of room, trimmed on stop
  rec.on = true; rec.notes = []; rec.open = new Map();
  play(); syncUI();
}
function stopRec() {
  if (!rec.on) return;
  const p = pos();
  for (const [m, o] of rec.open) rec.notes.push({ m, t: o.t, d: Math.max(0.05, p - o.t), v: o.v });
  rec.on = false; rec.open.clear(); pause();
  if (rec.notes.length) { song.layers.push({ id: ++rec.count, name: "Take " + rec.count, hand: $("recHand").value, notes: rec.notes, muted: false }); }
  song.minDur = 0; rebuild(); S.anchorPos = Math.min(S.anchorPos, song.dur); resetSched(S.anchorPos);
  renderLayers(); syncUI();
}

function renderLayers() {
  const box = $("layers");
  box.hidden = !song.layers.length;
  box.innerHTML = "";
  for (const L of song.layers) {
    const c = document.createElement("div"); c.className = "chip" + (L.muted ? " muted" : ""); c.dataset.id = L.id;
    const dotCol = L.hand === "auto" ? "linear-gradient(90deg,#f59e3b 50%,#4d9bff 50%)" : handColor(+L.hand);
    c.innerHTML = `<span class="dot" style="background:${dotCol}"></span><span>${L.name}</span>` +
      `<button data-act="hand" title="Change hand">${L.hand === "auto" ? "Auto" : L.hand === "0" ? "Right" : "Left"}</button>` +
      `<button data-act="mute">${L.muted ? "Unmute" : "Mute"}</button><button data-act="del" title="Delete take">&times;</button>`;
    box.appendChild(c);
  }
}
$("layers").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const L = song.layers.find(x => x.id === +b.closest(".chip").dataset.id); if (!L) return;
  if (b.dataset.act === "hand") L.hand = L.hand === "auto" ? "0" : L.hand === "0" ? "1" : "auto";
  else if (b.dataset.act === "mute") L.muted = !L.muted;
  else if (b.dataset.act === "del") song.layers = song.layers.filter(x => x !== L);
  rebuild(); resetSched(pos()); renderLayers();
});

// Export everything audible as a single-track .mid
function toMidi() {
  const ppq = 480, tps = ppq * song.bpm / 60, ev = [];
  for (const n of song.notes) {
    ev.push({ tick: Math.round(n.t * tps), on: 1, m: n.m, v: Math.max(1, Math.round(n.v * 127)) });
    ev.push({ tick: Math.round((n.t + n.d) * tps), on: 0, m: n.m, v: 0 });
  }
  ev.sort((a, b) => a.tick - b.tick || a.on - b.on);
  const tr = [], vlq = v => { const o = [v & 0x7f]; v >>= 7; while (v > 0) { o.unshift((v & 0x7f) | 0x80); v >>= 7; } tr.push(...o); };
  const us = Math.round(60e6 / song.bpm);
  tr.push(0, 0xff, 0x51, 3, (us >> 16) & 255, (us >> 8) & 255, us & 255);
  let last = 0;
  for (const e of ev) { vlq(e.tick - last); last = e.tick; tr.push(e.on ? 0x90 : 0x80, e.m, e.v); }
  tr.push(0, 0xff, 0x2f, 0);
  const n = tr.length;
  return new Uint8Array([0x4d, 0x54, 0x68, 0x64, 0, 0, 0, 6, 0, 0, 0, 1, ppq >> 8, ppq & 255,
    0x4d, 0x54, 0x72, 0x6b, (n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255, ...tr]);
}
function saveMidi() {
  if (!song.notes.length) return;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([toMidi()], { type: "audio/midi" }));
  a.download = (song.name || "waterfall").replace(/[^\w\- ]+/g, "") + ".mid"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ---------- UI ----------
const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0"); };
let seeking = false;
function updateTime(p) {
  $("time").textContent = fmt(p) + " / " + fmt(song.dur);
  if (!seeking && song.dur) $("seek").value = Math.round(p / song.dur * 1000);
}
function syncUI() {
  $("play").innerHTML = S.playing ? "&#10074;&#10074; Pause" : "&#9654; Play";
  $("metro").classList.toggle("on", S.metro); $("countin").classList.toggle("on", S.countin);
  $("loopOn").classList.toggle("on", S.loopOn);
  $("letters").classList.toggle("on", S.letters);
  $("rec").classList.toggle("rec", rec.on); $("rec").innerHTML = rec.on ? "&#9632; Stop rec" : "&#9679; Record";
  $("loopA").classList.toggle("on", S.loopA != null); $("loopB").classList.toggle("on", S.loopB != null);
}
function loadSong(s) {
  if (rec.on) stopRec();
  pause(); song = { notes: [], base: s.notes, layers: [], dur: 0, bpm: s.bpm, name: s.name, minDur: 0 };
  rebuild(); S.anchorPos = 0; S.loopA = S.loopB = null; S.loopOn = false; resetSched(0);
  $("title").textContent = s.name; $("hint").style.display = "none"; renderLayers(); syncUI();
}
async function loadFile(f) {
  try { loadSong(parseMidi(await f.arrayBuffer())); $("title").textContent = f.name; }
  catch (e) { $("hint").style.display = ""; $("hint").textContent = "Could not read that file: " + e.message; }
}
function say(msg) { const h = $("hint"); h.style.display = msg ? "" : "none"; h.textContent = msg || ""; }
async function scanSheet(f) {
  try {
    if (/\.(xml|musicxml)$/i.test(f.name)) { loadSong(parseMusicXml(await f.text())); $("title").textContent = f.name; return; }
    say("Reading the sheet music… this can take a minute");
    let r;
    try { r = await fetch("/scan", { method: "POST", headers: { "X-Filename": f.name }, body: f }); }
    catch (e) { throw new Error("Scan helper not running. Start it with: python falling-note-proto/scan_server.py"); }
    const body = await r.text();
    if (!r.ok) throw new Error(body.split("\n")[0]);
    loadSong(parseMusicXml(body)); $("title").textContent = f.name;
  } catch (e) { say("Scan failed: " + e.message); }
}
// Audio/video file -> notes, fully in the browser (Spotify Basic Pitch, Apache-2.0, bundled in ./vendor)
let transcriber = null;
async function audioToNotes(f) {
  try {
    say("Opening " + f.name + "…");
    const raw = await f.arrayBuffer();
    let dec;
    try { dec = await ensureAudio().decodeAudioData(raw); }
    catch (e) { throw new Error("The browser could not read the audio in that file. Try mp3, wav, m4a or mp4."); }
    if (dec.duration > 600) throw new Error("Files over 10 minutes are too long for in-browser transcription.");
    const off = new OfflineAudioContext(1, Math.ceil(dec.duration * 22050), 22050), src = off.createBufferSource();
    src.buffer = dec; src.connect(off.destination); src.start();
    const mono = (await off.startRendering()).getChannelData(0);
    say("Loading the note-detection model…");
    transcriber = transcriber || (await import("./vendor/basicpitch.js")).transcribe;
    const notes = await transcriber(mono, "vendor/model.json", p => say("Listening… " + Math.round(p * 100) + "%"));
    // Drop very short blips, and short notes that are just overtones (octave/12th/2 octaves...) of a longer note starting together.
    const HARM = new Set([12, 19, 24, 28, 31]);
    const good = notes
      .filter(n => n.d >= 0.12)
      .filter(n => !(n.d < 0.3 && notes.some(o => o !== n && o.d > n.d * 2 && Math.abs(o.t - n.t) < 0.06 && HARM.has(n.m - o.m))))
      .map(n => ({ ...n, h: handOfAuto(n.m) })).sort((a, b) => a.t - b.t);
    if (!good.length) throw new Error("No notes were detected. Piano or other clear single instruments work best.");
    loadSong({ notes: good, bpm: 100, name: f.name.replace(/\.[^.]+$/, "") });
  } catch (e) { say("Could not turn that into notes: " + e.message); }
}
$("audioFile").onchange = e => { if (e.target.files[0]) audioToNotes(e.target.files[0]); e.target.value = ""; };
$("scanFile").onchange =e => { if (e.target.files[0]) scanSheet(e.target.files[0]); e.target.value = ""; };
$("play").onclick = () => { if (rec.on) stopRec(); else S.playing ? pause() : play(); };
$("restart").onclick = () => seek(S.loopOn && S.loopA != null ? S.loopA : 0);
$("demo").onclick = () => loadSong(buildDemo());
$("file").onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ""; };
$("speed").onchange = e => setSpeed(parseFloat(e.target.value));
$("look").onchange = e => { S.look = e.target.value; };
$("hands").onchange = e => { S.hands = e.target.value; resetSched(pos()); };
$("letters").onclick = () => { S.letters = !S.letters; syncUI(); };
$("midiBtn").onclick = connectKeyboard;
$("rec").onclick = () => rec.on ? stopRec() : startRec();
$("saveMidi").onclick = saveMidi;
$("metro").onclick = () => { S.metro = !S.metro; syncUI(); };
$("countin").onclick = () => { S.countin = !S.countin; syncUI(); };
$("loopA").onclick = () => { S.loopA = S.loopA == null ? pos() : null; if (S.loopA != null && S.loopB != null && S.loopB <= S.loopA) S.loopB = null; syncUI(); };
$("loopB").onclick = () => { S.loopB = S.loopB == null ? pos() : null; if (S.loopA != null && S.loopB != null && S.loopB <= S.loopA) S.loopA = null; syncUI(); };
$("loopOn").onclick = () => { S.loopOn = !S.loopOn; syncUI(); };
$("seek").addEventListener("input", e => { seeking = true; seek(e.target.value / 1000 * song.dur); });
$("seek").addEventListener("change", () => { seeking = false; });
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); if (rec.on) stopRec(); else S.playing ? pause() : play(); }
  else if (e.code === "ArrowLeft") seek(pos() - 2);
  else if (e.code === "ArrowRight") seek(pos() + 2);
  else if (e.code === "Home") seek(0);
});
const stage = $("stage");
["dragenter", "dragover"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove("drag"); }));
stage.addEventListener("drop", e => {
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (/\.(mid|midi)$/i.test(f.name)) loadFile(f);
  else if (/^(audio|video)\//.test(f.type) || /\.(mp3|wav|m4a|mp4|mov|webm|ogg|flac)$/i.test(f.name)) audioToNotes(f);
  else scanSheet(f);
});

resize(); syncUI(); loadSong(buildDemo()); requestAnimationFrame(draw);
</script>
</body>
</html>
